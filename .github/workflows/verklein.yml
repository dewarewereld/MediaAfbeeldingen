name: Afbeeldingen verkleinen

on:
  push:
    paths:
      - ids.txt
      - scripts/verklein.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verklein:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/verklein.py
      - name: Resultaat opslaan
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add geoptimaliseerd rapport.csv
          git commit -m "Verkleinde afbeeldingen" || echo "Niets te committen"
          git push
